name: Build BakaSU + SuSFS Kernel (Realme 7 salaa)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel Source URL'
        required: true
        default: 'https://github.com/prathsprjkt/android_kernel_realme_salaa.git'
      kernel_branch:
        description: 'Kernel Branch'
        required: true
        default: '14.0'
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'salaa_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git libssl-dev libncurses-dev \
            libelf-dev dwarves rsync zip zlib1g-dev python3 libxml2-utils lzop \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Sources & Toolchain
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" "${{ github.event.inputs.kernel_repo }}" kernel
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          git clone --depth=1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu || true
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Setup BakaSU, SuSFS & Fix GCC Host Compatibility
        working-directory: ./kernel
        run: |
          # 1. Clean old KSU if present
          rm -rf KernelSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Kconfig drivers/Makefile 2>/dev/null || true

          # 2. Run BakaSU official setup
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -

          # 3. Integrate SuSFS files and test-apply 4.14 patch
          if [ -d "../susfs4ksu/kernel_patches" ]; then
            cp -rf ../susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
            cp -rf ../susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
            PATCH_FILE=$(find ../susfs4ksu/kernel_patches/ -maxdepth 1 -name "*susfs*.patch" | head -n 1)
            if [ -n "$PATCH_FILE" ]; then
              patch -p1 -F 3 --forward < "$PATCH_FILE" || true
            fi
          fi

          # 4. FIX: Patch dtc yylloc and enable -fcommon for host compiler (Ubuntu 22.04 GCC 11 fix)
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -fcommon /g' Makefile 2>/dev/null || true

          # 5. Resolve Defconfig file
          CONF="${{ github.event.inputs.defconfig }}"
          [ ! -f "arch/arm64/configs/$CONF" ] && CONF="salaa_defconfig"
          echo "RESOLVED_DEFCONFIG=$CONF" >> $GITHUB_ENV
          DEFCONFIG_FILE="arch/arm64/configs/$CONF"

          # 6. Disable -Werror
          sed -i 's/-Werror//g' Makefile arch/arm64/Makefile 2>/dev/null || true

          # 7. Append Kconfig flags directly
          printf "\nCONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_HAVE_KPROBES=y\nCONFIG_KPROBE_EVENTS=y\nCONFIG_KALLSYMS=y\nCONFIG_KALLSYMS_ALL=y\nCONFIG_OVERLAY_FS=y\nCONFIG_KSU_SUSFS=y\nCONFIG_KSU_SUSFS_SUS_PATH=y\nCONFIG_KSU_SUSFS_SUS_MOUNT=y\nCONFIG_KSU_SUSFS_SUS_KSTAT=y\nCONFIG_KSU_SUSFS_TRY_UMOUNT=y\nCONFIG_KSU_SUSFS_SPOOF_UNAME=y\nCONFIG_KSU_SUSFS_ENABLE_LOG=y\n" >> "$DEFCONFIG_FILE"

      - name: Compile Kernel Image
        working-directory: ./kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Syaz"
          export KBUILD_BUILD_HOST="GitHub-CI"

          make O=out ARCH=arm64 "$RESOLVED_DEFCONFIG"
          yes "" | make O=out ARCH=arm64 olddefconfig >/dev/null 2>&1 || true

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCFLAGS="-O2 -fcommon" \
            HOSTCXXFLAGS="-O2 -fcommon" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            Image.gz-dtb

      - name: Package AnyKernel3 Zip
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;|block=auto;|g' anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel.sh
          rm -rf .git
          zip -r9 ../BakaSU-SuSFS-salaa.zip * -x README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-SuSFS-salaa-Kernel
          path: BakaSU-SuSFS-salaa.zip
